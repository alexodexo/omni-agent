<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Omni-Agent</title>
  <desc id="d">Claude Code in the center, connected to DeepSeek, Kimi, Ollama, Codex and further Claude accounts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#141b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="990" cy="210" r="260" fill="url(#glow)"/>

  <!-- Text left -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="142" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#22d3ee" letter-spacing="2">CLAUDE CODE PLUGIN</text>
    <text x="72" y="222" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Omni-Agent</text>
    <rect x="72" y="244" width="168" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="296" font-size="27" fill="#c9d1e3">One Claude, many models.</text>
    <text x="72" y="334" font-size="21" fill="#8b94ab">Background agents on any provider, any account</text>
    <text x="72" y="364" font-size="21" fill="#8b94ab">and any agent CLI. Claude delegates on its own.</text>
  </g>

  <!-- Hub right -->
  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round">
    <path d="M990 210 L800 96"/>
    <path d="M990 210 L1160 78"/>
    <path d="M990 210 L760 232"/>
    <path d="M990 210 L1190 238"/>
    <path d="M990 210 L840 350"/>
    <path d="M990 210 L1120 360"/>
  </g>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" text-anchor="middle">
    <g fill="#1b2340" stroke="#334066">
      <rect x="722" y="76" width="156" height="40" rx="20"/>
      <rect x="1100" y="58" width="120" height="40" rx="20"/>
      <rect x="682" y="212" width="156" height="40" rx="20"/>
      <rect x="1126" y="218" width="130" height="40" rx="20"/>
      <rect x="762" y="330" width="156" height="40" rx="20"/>
      <rect x="1038" y="340" width="164" height="40" rx="20"/>
    </g>
    <g fill="#e6ebf7">
      <text x="800" y="102">DeepSeek</text>
      <text x="1160" y="84">Kimi</text>
      <text x="760" y="238">claude-work</text>
      <text x="1191" y="244">Codex</text>
      <text x="840" y="356">Ollama</text>
      <text x="1120" y="366">EUrouter</text>
    </g>
  </g>

  <!-- Core -->
  <circle cx="990" cy="210" r="62" fill="#0b0f1a" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="990" cy="210" r="46" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="990" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Claude</text>
  <text x="990" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Code</text>
</svg>
