name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    name: Python ${{ matrix.python }} auf ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (nur Standardbibliothek, kein echter Anbieter)
        run: python -m unittest discover -s tests -v
