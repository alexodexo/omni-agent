name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, no real provider)
        run: python -m unittest discover -s tests -v
      - name: Static check (undefined names, unused imports)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes lib bin/omni-agent
